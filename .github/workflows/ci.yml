name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  POSTGRES_USER: ci_user
  POSTGRES_PASSWORD: ci_password
  POSTGRES_DB: ci_db
  DATABASE_URL: postgresql+psycopg2://ci_user:ci_password@localhost:5432/ci_db
  # Placeholder values only - never real keys. The skills-matching modules
  # (huntloop.skills_matching / huntloop.skills_matching_gemini /
  # huntloop.skills_matching_mistral) raise at import if these are unset;
  # the test suite mocks/monkeypatches every real API call, so any
  # non-empty string is enough for CI collection.
  GROQ_API_KEY: dummy-key-for-ci
  GEMINI_API_KEY: dummy-key-for-ci
  MISTRAL_API_KEY: dummy-key-for-ci
  # Force sentence-transformers/huggingface offline so the model fetch
  # degrades deterministically on every run instead of depending on the
  # runner's network. Tests already expect graceful degradation
  # (is_relevant / embedding left NULL).
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest

  frontend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

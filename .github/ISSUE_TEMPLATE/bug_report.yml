name: Bug report
description: Something in HuntLoop is not working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe what went wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Describe what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: List the exact steps that led to the bug.
      placeholder: |
        1. Run ...
        2. Open ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: how-run
    attributes:
      label: How did you run HuntLoop
      options:
        - Docker Compose
        - Manual setup (local venv / npm)
        - Not sure
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. macOS 15, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Logs, screenshots, or other context.
    validations:
      required: false

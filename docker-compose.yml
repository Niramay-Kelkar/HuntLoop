services:
  db:
    # pgvector/pgvector:pg18 is the official pgvector project's image
    # (https://hub.docker.com/r/pgvector/pgvector) - a drop-in
    # postgres:18 replacement with the pgvector extension's shared
    # library pre-installed (not enabled by default - see the
    # 0001_enable_pgvector migration, which runs CREATE EXTENSION
    # IF NOT EXISTS vector). Confirmed via `docker manifest inspect` and
    # Docker Hub before switching: actively maintained (155M+ pulls,
    # last pushed 2026-08-13 as of this change), amd64+arm64, and `pg18`
    # currently resolves to pgvector 0.8.6 built against Postgres 18 -
    # matching the postgres:18 base this replaces exactly.
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Overridable via HUNTLOOP_DB_PORT (default 5433, unchanged) for the
      # same reason HUNTLOOP_DOCKER_SUBNET/HUNTLOOP_CADDY_IP are overridable
      # above - another Docker Compose project on this host (including a
      # second clone/checkout of this same repo) may already be bound to
      # this host port, which collides with both a manual `docker compose
      # up` and the nightly cron scrape's `docker compose run app ...` (see
      # README.md's Troubleshooting section and SESSIONS.md's 2026-09-27
      # port-collision investigation). Only the host side is overridable -
      # the container's own internal port stays 5432.
      - "${HUNTLOOP_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Same container-network-hostname override pattern as DATABASE_URL
      # above. src/huntloop/metrics.py's PUSHGATEWAY_URL defaults to
      # localhost:9091, which is correct for anything run on the host
      # (local dev, scripts/backfill_skills_matching.py) but wrong here -
      # inside this container, "localhost" means the container itself,
      # not the pushgateway service, so a push from main.py would always
      # get connection-refused regardless of whether pushgateway is
      # running. `pushgateway` is this compose project's own service
      # hostname, resolvable on the shared default network without any
      # host.docker.internal-style workaround (unlike DATABASE_URL, whose
      # real target is the host's system Postgres, not this project's own
      # `db` service - see the wrapper script's runtime -e override for
      # that case).
      PUSHGATEWAY_URL: pushgateway:9091
    # Added 2026-08-24 when the daily scraper (main.py) moved from the
    # local .venv to `docker compose run` (see
    # scripts/run_orchestrator_cron.sh and SESSIONS.md) - without this,
    # huntloop.logging_config.setup_logging()'s rotating logs/huntloop.log
    # file handler writes only inside this container's own ephemeral
    # filesystem, discarded on `--rm`; only the console-handler output
    # that happens to flow through docker's stdout into the wrapper
    # script's own logs/cron.log redirect would survive. Same fix/
    # reasoning as `api`'s ./data/resumes mount below.
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  # One-shot migration + sample-data seed step, added so a plain
  # `docker compose up` against a fresh `pgdata` volume is fully
  # self-contained - no separate manual `alembic upgrade head` command,
  # and no empty-database dashboard on first run. Same image as `app`
  # (build: .), no ports, no restart policy - it runs `alembic upgrade
  # head` (the sole source of schema creation, same as every other path
  # in this project - see CLAUDE.md) then
  # scripts/seed_sample_job_postings.py (see that script and
  # data/samples/README.md), then exits 0. `app`/`api` both wait on this
  # via `service_completed_successfully` below rather than running
  # against a database that might still be unmigrated/unseeded.
  # scripts/seed_sample_job_postings.py gates on a real
  # `SELECT COUNT(*) FROM job_postings` check - it only ever inserts
  # anything the very first time this runs against a genuinely empty
  # table, and is a correct no-op on every later `docker compose up`
  # (schema already migrated, and either the sample or a real scrape has
  # since populated job_postings).
  seed:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["sh", "-c", "alembic upgrade head && python scripts/seed_sample_job_postings.py"]
    depends_on:
      db:
        condition: service_healthy

  # FastAPI backend service, added 2026-08-22 - a separate concern from
  # `app` (the scraper/orchestrator), deliberately not merged into it.
  # Real endpoints as of 2026-08-22 - see src/huntloop/api/main.py.
  #
  # DATABASE_URL points at the bundled `db` service, same pattern `app`
  # already uses above - `api` is self-contained for a fresh
  # `docker compose up`: no separate host Postgres needed, and (via the
  # `seed` service above) it never starts against an unmigrated/empty
  # database. This replaces an earlier design where `api` pointed at
  # `host.docker.internal:5432` (the host's own real system Postgres) -
  # that meant a fresh clone's `api` container 500'd on every endpoint,
  # since nothing real lives at that address on a stranger's machine (or,
  # worse, it could silently connect to some unrelated Postgres a
  # stranger happens to run locally). Anyone who *wants* `api` to see
  # their own real host Postgres data instead of the bundled `db`
  # service/sample data can still do that - override DATABASE_URL in
  # their own .env, same env_file-override pattern every other variable
  # in this file already supports; no code change needed for that case.
  api:
    build: .
    command: ["uvicorn", "huntloop.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Tells huntloop.api.main's ProxyHeadersMiddleware setup which peer
      # IP is allowed to hand it an X-Forwarded-For header to trust (see
      # that module for the full reasoning) - the `caddy` service's own
      # pinned internal address (see the `default` network's `caddy`
      # entry below), nothing broader. Deliberately a single static IP,
      # not the whole subnet - anything else on this network (db, app,
      # frontend, ...) must NOT be able to spoof a client IP against this
      # service. Harmless when the `proxy` profile isn't running at all -
      # no `caddy` container exists to ever present this address, and
      # nothing ever sends this API an X-Forwarded-For header in that
      # case, so ProxyHeadersMiddleware never has anything to act on
      # regardless of what's configured here.
      #
      # HUNTLOOP_CADDY_IP is the SAME variable `caddy`'s own
      # ipv4_address (below) is pinned to, deliberately not a second
      # variable - this value must always equal whatever `caddy` is
      # actually pinned to, and reusing one variable makes that
      # impossible to drift out of sync by editing just one of the two.
      # See the `networks.default` block at the bottom of this file for
      # why/when to override it (a subnet collision with another
      # Compose project) and README.md's Troubleshooting section.
      TRUSTED_PROXY_IPS: ${HUNTLOOP_CADDY_IP:-172.28.0.10}
    # POST /resumes/upload (added 2026-08-23, see CLAUDE.md/SESSIONS.md)
    # writes to data/resumes/ inside the container - data/resumes/ is
    # both gitignored and dockerignored (real personal data, never baked
    # into the image), so without this mount an uploaded file would only
    # exist in the container's own writable layer: invisible on the host
    # and gone the next time the container is recreated. This mount makes
    # uploads land in the same real data/resumes/ directory
    # scripts/ingest_resume.py has always read from/written to manually.
    volumes:
      - ./data/resumes:/app/data/resumes
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    # Bound to loopback only, not every interface - this API is
    # unauthenticated (see huntloop/api/routers/drafting.py's own
    # security warning) and was previously reachable from anywhere on
    # the LAN/internet that could route to this host's port 8000, not
    # just from this machine. 127.0.0.1 is loopback-only and reachable
    # from the host exactly like the old "localhost" default was (same
    # loopback interface, confirmed live - see the port-binding audit in
    # SESSIONS.md), so plain local/Docker use is unaffected. The `caddy`
    # service (proxy profile, below) is unaffected too - it reaches this
    # service over the internal Docker network via the service name
    # (http://api:8000, see caddy/Caddyfile), which has nothing to do
    # with this host-side port's bind address.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      # python, not curl/wget - the python:3.13-slim base image this
      # shares with `app` doesn't include either.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Next.js frontend, added so a plain `docker compose up` brings up the
  # full stack (backend + frontend) with no separate `npm run dev` step -
  # see frontend/Dockerfile and README.md's Frontend section. This is a
  # production-style `next build && next start` image, not the dev
  # server with hot reload; `npm run dev` (see the Frontend section)
  # stays the faster loop for active local development and isn't
  # replaced by this.
  #
  # NEXT_PUBLIC_API_URL is a BUILD arg, not a runtime `environment:` var -
  # the frontend runs entirely in the user's own browser regardless of
  # whether it's containerized, so this is the URL the browser itself
  # will call, not a container-to-container address. That's the same
  # host-mapped port (localhost:8000) the api service already publishes
  # below, matching src/lib/api.ts's own http://localhost:8000 default -
  # not overridden here since the default is already correct for this
  # setup, but spelled out via build.args for clarity/future overrides.
  #
  # `${NEXT_PUBLIC_API_URL:-http://localhost:8000}` - reads the same-named
  # env var if set, otherwise keeps the plain-Docker default above
  # completely unchanged. Only relevant for the optional "proxy" profile
  # below: a self-hoster using Caddy sets NEXT_PUBLIC_API_URL=/api in
  # .env before building, so the browser calls the same-origin /api path
  # Caddy proxies through, instead of a fixed localhost:8000 (see
  # README.md's "Reverse proxy / HTTPS for self-hosting" section). Nobody
  # not using that profile needs to set this - unset behaves exactly as
  # before.
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    # Loopback-only, same reasoning as `api`'s port binding above - this
    # closes the same class of gap on the frontend's own host port.
    # Caddy (proxy profile) is unaffected, reaching this over the
    # internal Docker network via http://frontend:3000 (see
    # caddy/Caddyfile), not via this host-side binding.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional reverse proxy / automatic HTTPS for anyone self-hosting this
  # stack beyond localhost - see README.md's "Reverse proxy / HTTPS for
  # self-hosting" section for the full writeup (evaluated against
  # nginx+certbot and Traefik first; Caddy won on config size, native
  # Docker Compose fit, and footprint for a solo self-hoster's scale).
  #
  # Behind the "proxy" Compose profile, same pattern as `observability`
  # below - a plain `docker compose up` never starts this, so it changes
  # nothing for anyone running locally. Opt in with:
  #   docker compose --profile proxy up -d
  #
  # Caddy terminates real Let's Encrypt HTTPS for HUNTLOOP_DOMAIN (see
  # caddy/Caddyfile - required env var, no example/placeholder domain
  # baked in) and reverse-proxies to the existing `frontend`/`api`
  # services over the compose network - it does not replace their own
  # published ports, which stay available for direct/local access
  # exactly as before.
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      HUNTLOOP_DOMAIN: ${HUNTLOOP_DOMAIN}
    # Pinned to a fixed address on the `default` network (see this
    # file's top-level `networks:` block for the subnet this comes
    # from) instead of an address Docker would otherwise assign
    # dynamically - `api`'s TRUSTED_PROXY_IPS (above) has to name a
    # specific, stable peer address for ProxyHeadersMiddleware to trust,
    # and a dynamic address could silently change across a container
    # recreate/restart, or even (in principle) be reused by a different
    # container later. Every other service is untouched, still just
    # auto-joining `default` with whatever address Docker hands out.
    #
    # HUNTLOOP_CADDY_IP - same variable `api`'s TRUSTED_PROXY_IPS reads
    # above, so the two can't drift apart. Override it (along with
    # HUNTLOOP_DOCKER_SUBNET below) only if 172.28.0.0/24 collides with
    # another Docker network already on this host - see README.md's
    # Troubleshooting section.
    networks:
      default:
        ipv4_address: ${HUNTLOOP_CADDY_IP:-172.28.0.10}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates + the ACME account key live here. This MUST persist
      # across restarts/recreates - losing it makes Caddy re-request a
      # fresh certificate on next boot, and Let's Encrypt's real rate
      # limits (5 failures per account/hostname/hour, 5 duplicate certs
      # per exact hostname set per week) mean repeatedly losing this
      # volume can get a domain temporarily rate-limited. Never run this
      # service with `-v`/`down -v` unless you genuinely intend to throw
      # the certificate away.
      - caddy_data:/data
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy

  # Observability stack (Prometheus + Pushgateway + Grafana), gated behind
  # the "observability" profile so a plain `docker-compose up` for regular
  # dev work doesn't start any of it. Infrastructure only, per design:
  # nothing in the app pushes real metrics yet, and no dashboards are
  # provisioned - see CLAUDE.md/SESSIONS.md.
  pushgateway:
    image: prom/pushgateway:v1.10.0
    profiles: ["observability"]
    # Continuity matters here: Pushgateway only holds the latest value
    # per grouping key, not a time series - if it (or Prometheus) isn't
    # running when a scheduled run pushes, that day's numbers are lost
    # for good (see CLAUDE.md/SESSIONS.md 2026-09-04 "Investigate empty
    # Grafana dashboards"). `unless-stopped` means Docker restarts this
    # container automatically if it crashes or Docker Desktop itself
    # restarts, so a one-time `docker compose --profile observability up
    # -d` keeps it running in the background indefinitely - not
    # something to re-start before every cron run.
    restart: unless-stopped
    ports:
      - "9091:9091"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9091/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    # Same continuity reasoning as pushgateway's `restart` comment above -
    # Prometheus has to actually be running to scrape a pushed value
    # before the next day's push overwrites it under the same grouping
    # key, so it needs to stay up continuously, not just around each
    # cron run.
    restart: unless-stopped
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      pushgateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    # Added for consistency with prometheus/pushgateway above, not
    # because Grafana's own continuity matters for data integrity - it's
    # a read-only viewer over Prometheus's real storage, so it staying
    # off between manual look-ins loses nothing. No harm in it staying
    # up automatically too.
    restart: unless-stopped
    environment:
      # Local dev only - not a production credential. Override via
      # GRAFANA_ADMIN_PASSWORD in .env if you want something other than
      # the default.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      # Host port 3001, not 3000 - 3000 is the Next.js frontend dev
      # server's port (see CLAUDE.md/SESSIONS.md 2026-09-04). Container
      # port stays 3000 (Grafana's own default, unrelated to the host
      # side of this mapping).
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  # Explicit subnet on the implicit `default` network (every service
  # still joins it automatically exactly as before) purely so `caddy`
  # can be pinned to a fixed address within it - see the `caddy` service
  # and `api`'s TRUSTED_PROXY_IPS above. Docker Compose requires a
  # network to have a declared subnet before any service on it can
  # request a static `ipv4_address`; without this block there would be
  # no fixed address to trust in the first place. Everything else about
  # this network (which services join it, DNS-by-service-name,
  # connectivity) is unchanged - only the specific subnet is now pinned
  # instead of Docker Compose picking one automatically.
  #
  # HUNTLOOP_DOCKER_SUBNET - overridable via .env, defaulting to the
  # original hardcoded value. This subnet is a genuinely common one for
  # other Compose projects to also default to or hand-pick, so a
  # stranger with another project already using it (or running a second
  # clone/checkout of this repo) hits Docker's real "Pool overlaps with
  # other one on this address space" error on `docker compose up` - see
  # README.md's Troubleshooting section for the fix. If you override
  # this, also override HUNTLOOP_CADDY_IP (above, on the `caddy`
  # service) to a `.x` address inside the new subnet - it's a separate
  # variable because Compose can't derive one from the other, but it
  # must stay inside whatever subnet this resolves to.
  default:
    ipam:
      config:
        - subnet: ${HUNTLOOP_DOCKER_SUBNET:-172.28.0.0/24}

volumes:
  pgdata:
  caddy_data:
  prometheus_data:
  grafana_data:

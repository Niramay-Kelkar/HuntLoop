services:
  db:
    # pgvector/pgvector:pg18 is the official pgvector project's image
    # (https://hub.docker.com/r/pgvector/pgvector) - a drop-in
    # postgres:18 replacement with the pgvector extension's shared
    # library pre-installed (not enabled by default - see the
    # 0001_enable_pgvector migration, which runs CREATE EXTENSION
    # IF NOT EXISTS vector). Confirmed via `docker manifest inspect` and
    # Docker Hub before switching: actively maintained (155M+ pulls,
    # last pushed 2026-08-13 as of this change), amd64+arm64, and `pg18`
    # currently resolves to pgvector 0.8.6 built against Postgres 18 -
    # matching the postgres:18 base this replaces exactly.
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Same container-network-hostname override pattern as DATABASE_URL
      # above. src/huntloop/metrics.py's PUSHGATEWAY_URL defaults to
      # localhost:9091, which is correct for anything run on the host
      # (local dev, scripts/backfill_skills_matching.py) but wrong here -
      # inside this container, "localhost" means the container itself,
      # not the pushgateway service, so a push from main.py would always
      # get connection-refused regardless of whether pushgateway is
      # running. `pushgateway` is this compose project's own service
      # hostname, resolvable on the shared default network without any
      # host.docker.internal-style workaround (unlike DATABASE_URL, whose
      # real target is the host's system Postgres, not this project's own
      # `db` service - see the wrapper script's runtime -e override for
      # that case).
      PUSHGATEWAY_URL: pushgateway:9091
    # Added 2026-08-24 when the daily scraper (main.py) moved from the
    # local .venv to `docker compose run` (see
    # scripts/run_orchestrator_cron.sh and SESSIONS.md) - without this,
    # huntloop.logging_config.setup_logging()'s rotating logs/huntloop.log
    # file handler writes only inside this container's own ephemeral
    # filesystem, discarded on `--rm`; only the console-handler output
    # that happens to flow through docker's stdout into the wrapper
    # script's own logs/cron.log redirect would survive. Same fix/
    # reasoning as `api`'s ./data/resumes mount below.
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  # FastAPI backend service, added 2026-08-22 - a separate concern from
  # `app` (the scraper/orchestrator), deliberately not merged into it.
  # Real endpoints as of 2026-08-22 - see src/huntloop/api/main.py.
  #
  # DATABASE_URL deliberately points at host.docker.internal:5432 - the
  # real local system Postgres where the actual scraped/matched data
  # lives - NOT the docker-compose `db` service (a separate, smaller
  # instance, see the two-Postgres-instances note in CLAUDE.md). Same
  # host.docker.internal pattern already used for the embeddings
  # backfill (scripts/backfill_embeddings.py, run via `docker compose
  # run` with a DATABASE_URL override - see SESSIONS.md). extra_hosts
  # below is only needed on Linux (Docker Desktop on Mac/Windows already
  # resolves host.docker.internal natively) but is harmless everywhere,
  # so it's included for portability rather than assuming Mac.
  # Consequently `api` no longer depends on the `db` service at all -
  # it never talks to it.
  api:
    build: .
    command: ["uvicorn", "huntloop.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:5432/${POSTGRES_DB}
    # POST /resumes/upload (added 2026-08-23, see CLAUDE.md/SESSIONS.md)
    # writes to data/resumes/ inside the container - data/resumes/ is
    # both gitignored and dockerignored (real personal data, never baked
    # into the image), so without this mount an uploaded file would only
    # exist in the container's own writable layer: invisible on the host
    # and gone the next time the container is recreated. This mount makes
    # uploads land in the same real data/resumes/ directory
    # scripts/ingest_resume.py has always read from/written to manually.
    volumes:
      - ./data/resumes:/app/data/resumes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    healthcheck:
      # python, not curl/wget - the python:3.13-slim base image this
      # shares with `app` doesn't include either.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Observability stack (Prometheus + Pushgateway + Grafana), gated behind
  # the "observability" profile so a plain `docker-compose up` for regular
  # dev work doesn't start any of it. Infrastructure only, per design:
  # nothing in the app pushes real metrics yet, and no dashboards are
  # provisioned - see CLAUDE.md/SESSIONS.md.
  pushgateway:
    image: prom/pushgateway:v1.10.0
    profiles: ["observability"]
    # Continuity matters here: Pushgateway only holds the latest value
    # per grouping key, not a time series - if it (or Prometheus) isn't
    # running when a scheduled run pushes, that day's numbers are lost
    # for good (see CLAUDE.md/SESSIONS.md 2026-09-04 "Investigate empty
    # Grafana dashboards"). `unless-stopped` means Docker restarts this
    # container automatically if it crashes or Docker Desktop itself
    # restarts, so a one-time `docker compose --profile observability up
    # -d` keeps it running in the background indefinitely - not
    # something to re-start before every cron run.
    restart: unless-stopped
    ports:
      - "9091:9091"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9091/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    # Same continuity reasoning as pushgateway's `restart` comment above -
    # Prometheus has to actually be running to scrape a pushed value
    # before the next day's push overwrites it under the same grouping
    # key, so it needs to stay up continuously, not just around each
    # cron run.
    restart: unless-stopped
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      pushgateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    # Added for consistency with prometheus/pushgateway above, not
    # because Grafana's own continuity matters for data integrity - it's
    # a read-only viewer over Prometheus's real storage, so it staying
    # off between manual look-ins loses nothing. No harm in it staying
    # up automatically too.
    restart: unless-stopped
    environment:
      # Local dev only - not a production credential. Override via
      # GRAFANA_ADMIN_PASSWORD in .env if you want something other than
      # the default.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      # Host port 3001, not 3000 - 3000 is the Next.js frontend dev
      # server's port (see CLAUDE.md/SESSIONS.md 2026-09-04). Container
      # port stays 3000 (Grafana's own default, unrelated to the host
      # side of this mapping).
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
